name: Voicebank iOS

# Compile l'édition iOS de l'app voicebank sur un runner macOS, pour vérifier
# qu'elle compile sans avoir de Mac. Ne produit pas d'IPA signée : la signature
# demande un certificat Apple (voir bin/build-voicebank-ipa.sh).
on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - name: Charge de travail iOS
        run: dotnet workload install ios
      - name: Compilation (simulateur, sans signature)
        run: |
          dotnet build SekaiUtau.Voicebank.iOS/SekaiUtau.Voicebank.iOS.csproj \
            -c Release -f net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64
