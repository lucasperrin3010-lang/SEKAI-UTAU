name: Voicebank iOS

# Compile l'edition iOS de l'app voicebank sur un runner macOS et produit un IPA
# NON SIGNE (Payload/*.app zippe). Windows ne peut pas compiler iOS : Apple exige
# macOS et Xcode. L'IPA non signee s'installe ensuite sur un iPhone depuis
# Windows avec Sideloadly (compte Apple gratuit : 7 jours, a resigner ensuite).
on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - name: Charge de travail iOS
        run: |
          # Ne pas lancer « dotnet workload update » : il installe un pack iOS
          # (27.x) qui exige un Xcode plus recent que celui de l'image.
          dotnet workload install ios
          dotnet workload list
      - name: Xcode attendu par le pack iOS
        run: |
          # Le pack iOS du SDK 10 exige Xcode 26.0 ; l'image en a plusieurs.
          if [ -d /Applications/Xcode_26.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app
          fi
          xcodebuild -version
      - name: Compilation (appareil, sans signature)
        run: |
          dotnet publish SekaiUtau.Voicebank.iOS/SekaiUtau.Voicebank.iOS.csproj \
            -c Release -f net10.0-ios -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false -p:UseInterpreter=true -o out
      - name: Paquet IPA
        run: |
          set -euo pipefail
          ls -la out
          APP=$(find out -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SEKAI-UTAU-Voicebank-non-signee.ipa Payload
          ls -lh SEKAI-UTAU-Voicebank-non-signee.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ipa-non-signee
          path: SEKAI-UTAU-Voicebank-non-signee.ipa
          if-no-files-found: error
